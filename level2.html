<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第二關：樓梯口的大蝦捲</title>
<style>
  html, body { margin: 0; height: 100%; background: #2b211b; display: flex; align-items: center; justify-content: center; }
  #game { max-width: 100vw; max-height: 100vh; border: 4px solid #5a4636; border-radius: 8px; background: #f3e3c3; }
  #help { position: fixed; left: 0; right: 0; bottom: 6px; text-align: center; font: 13px sans-serif; color: #c9b8a6; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="help">方向鍵或 WASD 走路 · Z / Enter / 空白 調查與翻頁 · I 道具 · R 重玩</div>
<script>
// 可愛解謎小遊戲 · 核心邏輯（魚乾寫）。純邏輯，沒有畫面與 DOM：
// 瀏覽器版（engine/ui.js）與檢查腳本（check/）共用這一份，所以檢查腳本驗的就是玩家玩的規則。
// 關卡資料格式見 DESIGN.md；levels/level1.json、level2.json 是範例。
//
// 物件可以有 by_state：{ 狀態名: { x, y, w, h, solid, sprite } }，目前狀態有寫的欄位會蓋過物件本身的欄位（蝦捲大版與小版就是這樣換位置與大小）。
// 計時：動作 {timer:{id,moves,label,then:[...]}}，之後每「真的走出一步」就減一，歸零時執行 then；調查與對話不算步數。
// 對話：動作 {say:[...]} 會把句子接在對話框後面（對話框沒開就開一個）。

const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

function createGame(level) {
  const g = {
    level,
    flags: new Set(),
    items: (level.start_items || []).slice(),
    states: {},
    timers: {}, // id -> { left, label, then }
    pos: { x: level.start.x, y: level.start.y },
    facing: level.start.facing || "down",
    dialog: null, // { lines: [...], i: 0 }
    pendingEnd: null,
    pendingAfter: null, // 對話播完後要執行的動作 [...]
    pendingMinigame: null, // 對話播完後要開始的小遊戲 { id, win: [...] ... }
    minigame: null, // 正在玩的小遊戲；有的時候不能走路也不能調查，由畫面端處理按鍵
    ended: null, // 結局 id
    steps: 0,
  };
  for (const o of level.objects) if (o.state) g.states[o.id] = o.state;
  if (level.intro && level.intro.length) g.dialog = { lines: level.intro.slice(), i: 0 };
  return g;
}

// ---- 條件 ----
function condOk(g, c) {
  if (c.flag !== undefined) return g.flags.has(c.flag);
  if (c.no_flag !== undefined) return !g.flags.has(c.no_flag);
  if (c.has !== undefined) return g.items.includes(c.has);
  if (c.no !== undefined) return !g.items.includes(c.no);
  if (c.state_is !== undefined) return g.states[c.state_is[0]] === c.state_is[1];
  throw new Error("不認得的條件：" + JSON.stringify(c));
}
function whenOk(g, when) {
  return !when || when.every((c) => condOk(g, c));
}

// ---- 物件與地形 ----
// 物件現在的樣子：把目前狀態的 by_state 蓋在物件本身的欄位上
function look(g, o) {
  const st = g.states[o.id];
  const over = o.by_state && st && o.by_state[st];
  return over ? { ...o, ...over } : o;
}
function visible(g, o) {
  return whenOk(g, o.visible_when);
}
function cellsOf(g, o) {
  const r = look(g, o);
  const out = [];
  for (let dx = 0; dx < r.w; dx++) for (let dy = 0; dy < r.h; dy++) out.push({ x: r.x + dx, y: r.y + dy });
  return out;
}
function objectAt(g, x, y) {
  let hit = null;
  for (const o of g.level.objects) {
    if (!visible(g, o)) continue;
    const r = look(g, o);
    if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) hit = o; // 後面的蓋在前面
  }
  return hit;
}
function wallAt(g, x, y) {
  const { w, h } = g.level.grid;
  if (x < 0 || y < 0 || x >= w || y >= h) return true;
  return g.level.walls[y][x] !== "."; // "." 以外都是走不進去的地形："#" 一般牆，其他字元（例如 S 海、R 河）靠 level.wall_tiles 指定圖
}
// 這一格走不走得進去：牆、出界、擋路的物件
function blocked(g, x, y) {
  if (wallAt(g, x, y)) return true;
  const o = objectAt(g, x, y);
  return !!(o && look(g, o).solid);
}

// ---- 操作 ----
function move(g, dir) {
  if (g.dialog || g.ended || g.minigame) return false;
  const d = DIRS[dir];
  if (!d) throw new Error("不認得的方向：" + dir);
  g.facing = dir;
  const nx = g.pos.x + d[0], ny = g.pos.y + d[1];
  if (blocked(g, nx, ny)) return false;
  g.pos = { x: nx, y: ny };
  g.steps++;
  tickTimers(g);
  return true;
}

// 面前那一格的物件；非擋路的物件（地上的小東西）腳下那格也算
function targetObject(g) {
  const d = DIRS[g.facing];
  const front = objectAt(g, g.pos.x + d[0], g.pos.y + d[1]);
  if (front) return front;
  const under = objectAt(g, g.pos.x, g.pos.y);
  return under && !look(g, under).solid ? under : null;
}

function pushDialog(g, lines) {
  if (g.dialog) g.dialog.lines.push(...lines);
  else g.dialog = { lines: lines.slice(), i: 0 };
}

function applyOps(g, ops) {
  for (const op of ops || []) {
    if (op.set !== undefined) g.flags.add(op.set);
    else if (op.give !== undefined) { if (!g.items.includes(op.give)) g.items.push(op.give); }
    else if (op.take !== undefined) g.items = g.items.filter((i) => i !== op.take);
    else if (op.state !== undefined) g.states[op.state[0]] = op.state[1];
    else if (op.end !== undefined) g.pendingEnd = op.end;
    else if (op.say !== undefined) pushDialog(g, op.say);
    else if (op.timer !== undefined) g.timers[op.timer.id] = { left: op.timer.moves, max: op.timer.moves, label: op.timer.label || "", then: op.timer.then || [] };
    else if (op.cancel_timer !== undefined) delete g.timers[op.cancel_timer];
    else if (op.minigame !== undefined) g.pendingMinigame = op.minigame;
    else throw new Error("不認得的動作：" + JSON.stringify(op));
  }
  ejectPlayer(g);
}

// 物件換狀態後，玩家可能站在變成擋路的格子裡：推到最近的空格
function ejectPlayer(g) {
  if (!blocked(g, g.pos.x, g.pos.y)) return;
  const seen = new Set([g.pos.x + "," + g.pos.y]);
  const q = [{ ...g.pos }];
  while (q.length) {
    const p = q.shift();
    for (const d of Object.values(DIRS)) {
      const nx = p.x + d[0], ny = p.y + d[1], k = nx + "," + ny;
      if (seen.has(k) || nx < 0 || ny < 0 || nx >= g.level.grid.w || ny >= g.level.grid.h) continue;
      seen.add(k);
      if (!blocked(g, nx, ny)) { g.pos = { x: nx, y: ny }; return; }
      q.push({ x: nx, y: ny });
    }
  }
}

// 每走出一步，所有計時減一，歸零的執行 then
function tickTimers(g) {
  for (const id of Object.keys(g.timers)) {
    const t = g.timers[id];
    t.left--;
    if (t.left <= 0) {
      delete g.timers[id];
      applyOps(g, t.then);
    }
  }
}

// 對某個物件執行第一個條件成立的互動；回傳執行的那筆（沒有就 null）
function runInteraction(g, o) {
  const it = (o.interactions || []).find((x) => whenOk(g, x.when));
  if (!it) return null;
  applyOps(g, it.do);
  if (it.after_say && it.after_say.length) g.pendingAfter = it.after_say; // 對話播完才執行的動作（例如講完話才跑走）
  if (it.say && it.say.length) pushDialog(g, it.say);
  else if (!g.dialog) afterDialog(g);
  return it;
}

function finishEnd(g) {
  g.ended = g.pendingEnd;
  g.pendingEnd = null;
}

// 對話播完（或根本沒有對話）之後：結局生效，或開始小遊戲
function afterDialog(g) {
  if (g.pendingAfter) {
    const ops = g.pendingAfter;
    g.pendingAfter = null;
    applyOps(g, ops);
    if (g.dialog) return; // 這些動作自己又開了對話，等那段播完再說
  }
  if (g.pendingEnd) finishEnd(g);
  else if (g.pendingMinigame) { g.minigame = g.pendingMinigame; g.pendingMinigame = null; }
}

// 小遊戲結束：成功就執行 win 裡的動作，取消（或失敗放棄）什麼都不發生。小遊戲可以無限重試，所以檢查器把它當成「一定成功」。
function resolveMinigame(g, ok) {
  const mg = g.minigame;
  g.minigame = null;
  if (ok && mg) {
    applyOps(g, mg.win || []);
    if (!g.dialog) afterDialog(g); // win 裡沒有對話但有 end 或下一個小遊戲
  }
}

// 調查鍵：對話框開著就往下一句，否則調查面前的物件
function interact(g) {
  if (g.ended || g.minigame) return false;
  if (g.dialog) {
    g.dialog.i++;
    if (g.dialog.i >= g.dialog.lines.length) {
      g.dialog = null;
      afterDialog(g);
    }
    return true;
  }
  const o = targetObject(g);
  if (!o) return false;
  return !!runInteraction(g, o);
}

// ---- 存檔 ----
function snapshot(g) {
  return JSON.stringify({ flags: [...g.flags], items: g.items, states: g.states, timers: g.timers, pos: g.pos, facing: g.facing, ended: g.ended });
}
function restore(g, text) {
  const s = JSON.parse(text);
  g.flags = new Set(s.flags);
  g.items = s.items;
  g.states = s.states;
  g.timers = s.timers || {};
  g.pos = s.pos;
  g.facing = s.facing;
  g.ended = s.ended;
  g.dialog = null;
  g.pendingEnd = null;
  g.pendingMinigame = null;
  g.pendingAfter = null;
  g.minigame = null;
}

</script>

<script>
// 瀏覽器端：畫面、鍵盤、存檔（魚乾寫）。build.mjs 會把 core.mjs（去掉 export）、關卡資料、素材一起內嵌成單檔 HTML。
// 這支用到 core 的 createGame / move / interact / targetObject / objectAt / visible / snapshot / restore / DIRS。
// 沒有素材圖時用色塊加名字佔位，素材庫補上之後不用改這支。
(function () {
  var level = window.__LEVEL__;
  var sprites = window.__SPRITES__ || {};
  var actors = window.__ACTORS__ || {};
  var T = level.grid.tile;
  var W = level.grid.w * T, H = level.grid.h * T;
  var canvas = document.getElementById("game");
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext("2d");
  var SAVE_KEY = "cpg_" + level.id;

  var g = createGame(level);
  var imgCache = {};

  function loadSave() {
    try {
      var s = localStorage.getItem(SAVE_KEY);
      if (s) { var test = JSON.parse(s); if (!test.ended) { restore(g, s); } }
    } catch (e) { /* 沒有存檔或被擋就當新遊戲 */ }
  }
  function save() { try { localStorage.setItem(SAVE_KEY, snapshot(g)); } catch (e) { /* 存不了就算了 */ } }
  function reset() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
    g = createGame(level);
    visRect = {}; tweens = {}; lockUntil = 0;
  }

  // 物件演出：物件換狀態時，如果新狀態寫了 tween_ms，就把圖補間成「從舊位置走到新位置」，演出期間玩家鎖定不能操作。
  // 新狀態可再寫 wake_sprite 與 wake_ms：演出一開始先在原地停這張圖（例如睡醒坐起來），再開始走。邏輯狀態是立刻換好的，演出只是畫面。
  var visRect = {}; // 物件 id -> 上一個畫面的樣子
  var tweens = {}; // 物件 id -> { from, t0, wake, wakeMs, dur }
  var lockUntil = 0;
  function locked() { return nowMs < lockUntil; }
  function syncTweens() {
    level.objects.forEach(function (o) {
      if (!visible(g, o)) { delete visRect[o.id]; return; }
      var r = look(g, o), p = visRect[o.id];
      if (p && r.tween_ms && (p.x !== r.x || p.y !== r.y || p.w !== r.w || p.h !== r.h)) {
        var wakeMs = r.wake_sprite ? (r.wake_ms || 500) : 0;
        tweens[o.id] = { from: p, t0: nowMs, wake: r.wake_sprite || null, wakeMs: wakeMs, dur: r.tween_ms };
        lockUntil = Math.max(lockUntil, nowMs + wakeMs + r.tween_ms);
        held = [];
      }
      visRect[o.id] = { x: r.x, y: r.y, w: r.w, h: r.h };
    });
  }
  // 演出中的物件現在該畫在哪、用哪張圖；沒有演出就回 null
  function tweenView(o, r) {
    var t = tweens[o.id];
    if (!t) return null;
    var e = nowMs - t.t0;
    if (e >= t.wakeMs + t.dur) { delete tweens[o.id]; return null; }
    if (e < t.wakeMs) return { x: t.from.x, y: t.from.y, w: t.from.w, h: t.from.h, sprite: t.wake };
    var p = (e - t.wakeMs) / t.dur; p = p * p * (3 - 2 * p); // 起步與停下都緩一點
    var hop = -Math.abs(Math.sin(((e - t.wakeMs) / t.dur) * Math.PI * 6)) * 0.12; // 邊走邊小跳，單位是格
    return {
      x: t.from.x + (r.x - t.from.x) * p, y: t.from.y + (r.y - t.from.y) * p + hop,
      w: t.from.w + (r.w - t.from.w) * p, h: t.from.h + (r.h - t.from.h) * p, sprite: r.sprite
    };
  }
  if (!window.__NO_SAVE__) loadSave();

  function img(uri) {
    if (!uri) return null;
    if (!imgCache[uri]) { var im = new Image(); im.src = uri; imgCache[uri] = im; }
    return imgCache[uri];
  }
  function spriteFor(r, id) {
    var st = g.states[id];
    var uri = (st && sprites[r.sprite + "_" + st]) || sprites[r.sprite];
    return img(uri);
  }

  var COLORS = { floorA: "#f3e3c3", floorB: "#ecd9b4", wall: "#8a6f5a", obj: "#c9a27a", edge: "#5a4636" };

  function drawBoard() {
    var x, y;
    var floorImg = img(sprites[level.floor || "floor_wood"]), wallImg = img(sprites[level.wall || "wall_plain"]);
    for (y = 0; y < level.grid.h; y++) {
      for (x = 0; x < level.grid.w; x++) {
        var ch = level.walls[y][x], isWall = ch !== ".";
        var tileImg = isWall ? (ch !== "#" && level.wall_tiles && level.wall_tiles[ch] ? img(sprites[level.wall_tiles[ch]]) : wallImg) : floorImg;
        if (tileImg && tileImg.complete && tileImg.naturalWidth) { ctx.drawImage(tileImg, x * T, y * T, T, T); continue; }
        ctx.fillStyle = isWall ? COLORS.wall : ((x + y) % 2 ? COLORS.floorA : COLORS.floorB);
        ctx.fillRect(x * T, y * T, T, T);
      }
    }
    level.objects.forEach(function (o) {
      if (!visible(g, o)) return;
      var r = look(g, o); // 目前狀態的位置、大小、圖（蝦捲大小版就是這樣換）
      var tv = tweenView(o, r);
      if (tv) r = { x: tv.x, y: tv.y, w: tv.w, h: tv.h, sprite: tv.sprite, solid: r.solid, zzz: false };
      var im = spriteFor(r, o.id);
      var px = r.x * T, py = r.y * T, pw = r.w * T, ph = r.h * T;
      if (im && im.complete && im.naturalWidth) {
        if (o.fit === "bottom") { // 角色圖：保持比例，底邊對齊格子下緣、左右置中，這樣換大小時腳底在同一條線上
          var sc = Math.min(pw / im.naturalWidth, ph / im.naturalHeight), dw = im.naturalWidth * sc, dh = im.naturalHeight * sc;
          ctx.drawImage(im, px + (pw - dw) / 2, py + ph - dh, dw, dh);
        } else ctx.drawImage(im, px, py, pw, ph);
        if (r.zzz) drawZzz(px + pw * 0.62, py + ph * 0.22, Math.min(pw, ph));
        return;
      }
      if (r.zzz) drawZzz(px + pw * 0.62, py + ph * 0.22, Math.min(pw, ph));
      ctx.fillStyle = r.solid ? COLORS.obj : "rgba(255,255,255,0.55)";
      ctx.fillRect(px + 3, py + 3, pw - 6, ph - 6);
      ctx.strokeStyle = COLORS.edge; ctx.lineWidth = 2;
      ctx.strokeRect(px + 3, py + 3, pw - 6, ph - 6);
      ctx.fillStyle = COLORS.edge; ctx.font = "14px sans-serif"; ctx.textAlign = "center";
      ctx.fillText(o.name, px + pw / 2, py + ph / 2 + 5);
    });
  }

  // 睡著的 ZZZ：三個 Z 輪流從物件頭上往右上飄、放大、淡出（物件或 by_state 寫 "zzz": true 才有）
  function drawZzz(ax, ay, size) {
    ctx.save();
    ctx.textAlign = "center"; ctx.font = "bold 20px sans-serif";
    for (var i = 0; i < 3; i++) {
      var p = ((nowMs / 2400) + i / 3) % 1; // 0 到 1，三個錯開
      ctx.globalAlpha = Math.sin(p * Math.PI) * 0.9;
      ctx.font = "bold " + Math.round(14 + p * Math.min(18, size / 8)) + "px sans-serif";
      ctx.fillStyle = "#6b5ca5";
      ctx.fillText("Z", ax + p * 30, ay - p * 40);
    }
    ctx.restore();
  }

  // 走路動畫：邏輯上還是一格一格走（檢查腳本與存檔都吃格子），畫面把上一格到這一格補間滑過去，加輕微上下晃。
  var MOVE_MS = 120;
  var nowMs = 0;
  var anim = null; // { fx, fy, t0 }
  var held = []; // 按住中的方向，最後按的優先
  function animating() { return !!anim && nowMs - anim.t0 < MOVE_MS; }
  var bump = null; // 撞牆時往那個方向小晃一下 { dir, t0 }
  function bumping() { return !!bump && nowMs - bump.t0 < MOVE_MS; }
  function tryMove(dir) {
    var bx = g.pos.x, by = g.pos.y;
    var ok = move(g, dir);
    if (ok) anim = { fx: bx, fy: by, t0: nowMs };
    else if (!g.dialog && !g.ended && !bumping()) bump = { dir: dir, t0: nowMs };
    return ok;
  }

  function drawPlayer() {
    var gx = g.pos.x, gy = g.pos.y, bob = 0;
    if (animating()) {
      var p = (nowMs - anim.t0) / MOVE_MS;
      gx = anim.fx + (g.pos.x - anim.fx) * p;
      gy = anim.fy + (g.pos.y - anim.fy) * p;
      bob = -Math.abs(Math.sin(p * Math.PI)) * 5;
    }
    if (bumping()) {
      var bp = Math.sin(((nowMs - bump.t0) / MOVE_MS) * Math.PI) * 4, bd = DIRS[bump.dir];
      gx += (bd[0] * bp) / T; gy += (bd[1] * bp) / T;
    }
    var px = gx * T, py = gy * T + bob;
    var im = img(actors.yugan || sprites.yugan);
    if (im && im.complete && im.naturalWidth) {
      // 等比例縮放、底邊對齊格子、左右置中：128 方形圖照舊塞滿一格，長方形的新圖（例如紅蟹 Q 版）不會被拉變形
      var psc = T / Math.max(im.naturalWidth, im.naturalHeight), pw = im.naturalWidth * psc, ph = im.naturalHeight * psc;
      var dx = px + (T - pw) / 2, dy = py + T - ph;
      ctx.save();
      if (g.facing === "left") { ctx.translate(dx + pw, dy); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0, pw, ph); }
      else ctx.drawImage(im, dx, dy, pw, ph);
      ctx.restore();
    } else {
      ctx.fillStyle = "#ffcf5c"; ctx.beginPath(); ctx.arc(px + T / 2, py + T / 2, T / 2 - 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#5a4636"; ctx.font = "14px sans-serif"; ctx.textAlign = "center"; ctx.fillText("魚乾", px + T / 2, py + T / 2 + 5);
    }
    // 面向的小三角
    var d = DIRS[g.facing];
    ctx.fillStyle = "#5a4636";
    ctx.beginPath();
    ctx.arc(px + T / 2 + d[0] * (T / 2 - 4), py + T / 2 + d[1] * (T / 2 - 4), 4, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHint() {
    if (g.dialog || g.ended) return;
    var o = targetObject(g);
    if (!o) return;
    var r = look(g, o);
    ctx.strokeStyle = "#ff8a5c"; ctx.lineWidth = 3;
    ctx.strokeRect(r.x * T + 1, r.y * T + 1, r.w * T - 2, r.h * T - 2);
  }

  function wrap(text, maxW) {
    var lines = [], cur = "";
    for (var i = 0; i < text.length; i++) {
      var next = cur + text[i];
      if (ctx.measureText(next).width > maxW && cur) { lines.push(cur); cur = text[i]; } else cur = next;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function drawBox(lines, hint) {
    // 玩家在下半部時把對話框放到上面，免得擋住玩家腳邊的物件（開場白原本會蓋住倒下的櫃子）
    var bx = 24, bw = W - 48, bh = 40 + lines.length * 28 + 16;
    var by = g.pos.y >= level.grid.h / 2 ? 48 : H - bh - 16;
    ctx.fillStyle = "rgba(255,250,240,0.88)"; ctx.fillRect(bx, by, bw, bh); // 半透明，底下的物件還看得到輪廓
    ctx.strokeStyle = COLORS.edge; ctx.lineWidth = 3; ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = "#3d2f25"; ctx.font = "22px sans-serif"; ctx.textAlign = "left";
    lines.forEach(function (l, i) { ctx.fillText(l, bx + 20, by + 36 + i * 28); });
    if (hint) { ctx.textAlign = "right"; ctx.font = "16px sans-serif"; ctx.fillStyle = "#b07b4a"; ctx.fillText(hint, bx + bw - 14, by + bh - 12); }
  }

  function drawDialog() {
    if (!g.dialog) return;
    ctx.font = "22px sans-serif";
    var text = g.dialog.lines[g.dialog.i];
    drawBox(wrap(text, W - 48 - 40), g.dialog.i + 1 < g.dialog.lines.length ? "▼" : "▼ 關上");
  }

  // 道具視窗：按 I 或點左上角的道具列打開，列出圖示、名字、一句說明；開著時不能走，I、Esc、Enter 都能關
  var invOpen = false;
  function invBarWidth() { return 70 + Math.max(g.items.length, 1) * 62; }
  function setInv(open) { invOpen = open; if (open) held = []; }
  function drawInventoryWindow() {
    if (!invOpen || g.ended) return;
    var n = g.items.length, rowH = 72;
    var pw = 520, ph = 96 + Math.max(n, 1) * rowH, px = (W - pw) / 2, py = Math.max(24, (H - ph) / 2);
    ctx.fillStyle = "rgba(255,250,240,0.97)"; ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = COLORS.edge; ctx.lineWidth = 3; ctx.strokeRect(px, py, pw, ph);
    ctx.fillStyle = "#3d2f25"; ctx.textAlign = "left"; ctx.font = "26px sans-serif"; ctx.fillText("道具", px + 24, py + 44);
    if (!n) { ctx.font = "20px sans-serif"; ctx.fillStyle = "#8a6f5a"; ctx.fillText("還沒有撿到任何東西。", px + 24, py + 96); }
    g.items.forEach(function (id, i) {
      var it = level.items[id] || { name: id }, y = py + 64 + i * rowH;
      var im = img(it.icon && sprites[it.icon]);
      if (im && im.complete && im.naturalWidth) ctx.drawImage(im, px + 24, y, 56, 56);
      else { ctx.fillStyle = "#e9d3a8"; ctx.fillRect(px + 24, y, 56, 56); ctx.strokeStyle = COLORS.edge; ctx.lineWidth = 2; ctx.strokeRect(px + 24, y, 56, 56); }
      ctx.fillStyle = "#3d2f25"; ctx.font = "22px sans-serif"; ctx.fillText(it.name, px + 100, y + 24);
      if (it.desc) { ctx.font = "16px sans-serif"; ctx.fillStyle = "#6b5646"; ctx.fillText(it.desc, px + 100, y + 48); }
    });
    ctx.textAlign = "right"; ctx.font = "15px sans-serif"; ctx.fillStyle = "#b07b4a"; ctx.fillText("按 I 或 Esc 關上", px + pw - 20, py + ph - 14);
  }

  function drawInventory() {
    ctx.font = "16px sans-serif"; ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,250,240,0.85)"; ctx.fillRect(8, 8, 120, 28);
    ctx.fillStyle = "#3d2f25"; ctx.fillText("道具(I)：", 14, 28);
    g.items.forEach(function (id, i) {
      var it = level.items[id];
      var x = 70 + i * 62;
      ctx.fillStyle = "rgba(255,250,240,0.95)"; ctx.fillRect(x, 8, 58, 28);
      ctx.strokeStyle = COLORS.edge; ctx.lineWidth = 2; ctx.strokeRect(x, 8, 58, 28);
      ctx.fillStyle = "#3d2f25"; ctx.fillText(it ? it.name : id, x + 6, 28);
    });
  }

  // 計時條：縮小之類的限時效果，畫面右上顯示剩幾步（一格代表一步）
  function drawTimers() {
    var ids = Object.keys(g.timers);
    if (!ids.length || g.ended) return;
    ids.forEach(function (id, k) {
      var t = g.timers[id], cell = 14, w = t.max * cell + 20, x = W - w - 8, y = 8 + k * 40;
      ctx.fillStyle = "rgba(255,250,240,0.9)"; ctx.fillRect(x, y, w, 34);
      ctx.strokeStyle = COLORS.edge; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, 34);
      ctx.fillStyle = "#3d2f25"; ctx.font = "13px sans-serif"; ctx.textAlign = "left";
      ctx.fillText((t.label || id) + "：" + t.left, x + 8, y + 14);
      for (var i = 0; i < t.max; i++) {
        ctx.fillStyle = i < t.left ? (t.left <= 3 ? "#e0573a" : "#ff9f43") : "#e8dcc8";
        ctx.fillRect(x + 8 + i * cell, y + 20, cell - 3, 9);
      }
    });
  }

  // 釣包裹小遊戲：魚鉤左右來回晃（固定週期，不用隨機，檢查與試玩才驗得到），鉤子在綠色範圍內按確定鍵就成功，沒中可以無限重試。
  // 關卡資料動作 {minigame:{label,target,tolerance,period_ms,win:[...]}}，target 與 tolerance 是畫面寬度的比例（0 到 1）。
  var mgOn = false, mgT0 = 0, mgFailAt = -99999;
  function mgTarget(s) { return s.target === undefined ? 0.5 : s.target; }
  // 魚鉤位置。wobble（0 到 0.95）讓速度忽快忽慢：每個來回有一次經過目標時特別慢，另一次特別快，慢的那次就是讓玩家把握的機會；沒寫 wobble 就是等速。
  function mgFrac(s, t) {
    var w = (2 * Math.PI) / (s.period_ms || 2400), a = s.wobble || 0, th = w * t;
    if (s.start_speed > 1) {
      // 開場快、之後慢下來：一開始速度是 start_speed 倍，用 settle_ms 的時間常數指數衰減到基本速度（period_ms 那個週期），之後等速慢慢晃
      var tau = s.settle_ms || 2000;
      th = w * t + (s.start_speed - 1) * w * tau * (1 - Math.exp(-t / tau));
    } else if (a) {
      var c = Math.max(-1, Math.min(1, (mgTarget(s) - 0.5) / 0.42));
      var beta = Math.PI - Math.acos(c); // 讓最慢的那一刻剛好在目標位置
      th = w * t + a * Math.sin(w * t + beta);
    }
    return 0.5 + 0.42 * Math.cos(th); // 一開始在最右邊
  }
  function mgHit() {
    var s = g.minigame;
    if (!s) return false;
    return Math.abs(mgFrac(s, nowMs - mgT0) - mgTarget(s)) <= s.tolerance;
  }
  function mgPress() {
    if (!g.minigame || !mgOn) return; // 小遊戲剛打開、畫面還沒起算時的按鍵不算
    if (mgHit()) { resolveMinigame(g, true); save(); } else mgFailAt = nowMs;
  }
  function drawMinigame() {
    var s = g.minigame;
    if (!s) return;
    var pw = Math.min(W - 160, 720), ph = 300, px = (W - pw) / 2, py = (H - ph) / 2 - 10;
    ctx.fillStyle = "rgba(20,30,40,0.55)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#d9eef7"; ctx.fillRect(px, py, pw, ph); // 天空
    ctx.fillStyle = "#86bfdc"; ctx.fillRect(px, py + ph * 0.62, pw, ph * 0.38); // 海
    ctx.fillStyle = "#7d8a8f"; ctx.fillRect(px, py + ph - 46, pw, 46); // 消波塊
    var tx = px + mgTarget(s) * pw;
    ctx.fillStyle = "rgba(110,215,130,0.38)"; ctx.fillRect(tx - s.tolerance * pw, py + 40, s.tolerance * 2 * pw, ph - 86);
    var pim = img(sprites.item_parcel);
    if (pim && pim.complete && pim.naturalWidth) ctx.drawImage(pim, tx - 28, py + ph - 46 - 52, 56, 56);
    else { ctx.fillStyle = "#b9824b"; ctx.fillRect(tx - 22, py + ph - 46 - 40, 44, 40); }
    var hx = px + mgFrac(s, nowMs - mgT0) * pw, hy = py + ph * 0.52;
    ctx.strokeStyle = "#4a3b2d"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(hx, py + 6); ctx.lineTo(hx, hy); ctx.stroke(); // 釣線
    ctx.beginPath(); ctx.arc(hx + 9, hy, 9, Math.PI, Math.PI * 0.35, true); ctx.stroke(); // 鉤
    ctx.strokeStyle = COLORS.edge; ctx.lineWidth = 4; ctx.strokeRect(px, py, pw, ph);
    ctx.textAlign = "center"; ctx.fillStyle = "#3d2f25"; ctx.font = "22px sans-serif";
    ctx.fillText(s.label || "對準郵包，按確定鍵放下鉤子", W / 2, py + 30);
    ctx.font = "15px sans-serif"; ctx.fillStyle = "#f3e3c3"; ctx.fillText("確定鍵：放下鉤子　　Esc：先算了", W / 2, py + ph + 26);
    if (nowMs - mgFailAt < 700) { ctx.font = "bold 28px sans-serif"; ctx.fillStyle = "#e0573a"; ctx.fillText("差一點！再試一次", W / 2, py + ph * 0.42); }
  }

  function drawEnding() {
    if (!g.ended) return;
    var e = level.endings[g.ended];
    ctx.fillStyle = "rgba(255,246,230,0.92)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#3d2f25"; ctx.textAlign = "center"; ctx.font = "40px sans-serif";
    ctx.fillText(e.title, W / 2, H / 2 - 60);
    ctx.font = "22px sans-serif";
    e.text.forEach(function (l, i) { ctx.fillText(l, W / 2, H / 2 - 10 + i * 34); });
    ctx.font = "16px sans-serif"; ctx.fillStyle = "#b07b4a";
    if (level.next) { ctx.font = "26px sans-serif"; ctx.fillStyle = "#e0573a"; ctx.fillText("按 Enter 進入下一關", W / 2, H - 80); ctx.font = "16px sans-serif"; ctx.fillStyle = "#b07b4a"; }
    ctx.fillText("按 R 重玩", W / 2, H - 40);
  }

  function frame(ts) {
    if (ts !== undefined) nowMs = ts;
    // 按住方向鍵：走完一步就接著走下一步，不用重按
    syncTweens();
    if (g.minigame && !mgOn) { mgOn = true; mgT0 = nowMs; held = []; } else if (!g.minigame) mgOn = false; // 小遊戲一開始就重新起算魚鉤位置
    if (held.length && !g.dialog && !g.ended && !g.minigame && !invOpen && !animating() && !locked()) { tryMove(held[held.length - 1]); save(); }
    ctx.clearRect(0, 0, W, H);
    drawBoard(); drawHint(); drawPlayer(); drawInventory(); drawTimers(); drawMinigame(); drawDialog(); drawInventoryWindow(); drawEnding();
    if (!window.__NO_RAF__) requestAnimationFrame(frame);
  }

  var KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right"
  };
  function onKey(k) {
    if (locked() && k !== "r" && k !== "R") return true; // 演出中鎖定：只有重玩鍵能用
    if (g.ended && level.next && (k === "Enter" || k === " " || k === "z" || k === "Z")) { // 通關後切到下一關的單檔 html（同一個資料夾）
      try { window.location.href = level.next + ".html"; } catch (e) { /* 被擋就停在結局畫面 */ }
      return true;
    }
    if (k === "r" || k === "R") { setInv(false); reset(); return true; }
    if (g.minigame) { // 小遊戲進行中：確定鍵出手，Esc 放棄，其他鍵不動作
      if (k === "Escape") resolveMinigame(g, false);
      else if (k === "z" || k === "Z" || k === "Enter" || k === " ") mgPress();
      return true;
    }
    if (k === "i" || k === "I") { if (!g.ended && !g.dialog) setInv(!invOpen); return true; }
    if (invOpen) { // 道具視窗開著：Esc、Enter、Z、空白都是關上，其他鍵不動作
      if (k === "Escape" || k === "z" || k === "Z" || k === "Enter" || k === " ") setInv(false);
      return true;
    }
    if (KEYS[k]) { move(g, KEYS[k]); anim = null; save(); return true; } // 無頭試玩走這條：直接走格子，不補間
    if (k === "z" || k === "Z" || k === "Enter" || k === " ") { interact(g); save(); return true; }
    return false;
  }
  window.addEventListener("keydown", function (e) {
    var dir = KEYS[e.key];
    if (dir && !invOpen && !g.minigame) {
      e.preventDefault();
      if (held.indexOf(dir) < 0) held.push(dir);
      if (!e.repeat && !animating() && !g.dialog && !g.ended && !locked()) { tryMove(dir); save(); }
      return;
    }
    if (onKey(e.key)) e.preventDefault();
  });
  window.addEventListener("keyup", function (e) {
    var dir = KEYS[e.key];
    if (dir) held = held.filter(function (d) { return d !== dir; });
  });
  window.addEventListener("blur", function () { held = []; });
  // 手機或沒有鍵盤時的點擊：點畫面等於調查
  canvas.addEventListener("click", function (e) {
    if (locked()) return;
    if (g.minigame) { mgPress(); return; }
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : null;
    var cx = r && r.width ? (e.clientX - r.left) * (W / r.width) : -1, cy = r && r.height ? (e.clientY - r.top) * (H / r.height) : -1;
    if (cx >= 8 && cx <= invBarWidth() && cy >= 8 && cy <= 36) { onKey("i"); return; } // 點左上角的道具列
    if (invOpen) { setInv(false); return; }
    interact(g); save();
  });

  // 無頭試玩用：目前有沒有小遊戲、這一瞬間按下去會不會中
  window.__cpg = { key: onKey, frame: frame, get game() { return g; }, mg: function () { return g.minigame ? { ok: mgHit() } : null; } };
  frame();
})();

</script>
</body>
</html>
